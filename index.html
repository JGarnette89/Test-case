<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required or every env(safe-area-inset-*) in the
         three apps resolves to 0 and the UI runs under the notch / home bar. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1A1C20" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>DriveDraw</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1a1c20;
        color-scheme: dark;
      }
      body {
        /* Stops the rubber-band bounce dragging the whole page around when a
           drawing gesture runs off the edge of the canvas. */
        overscroll-behavior: none;
      }
      * {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
